<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#1C1C1E" />
			<stop offset="1" stop-color="#232326" />
		</linearGradient>
		<linearGradient id="red" x1="184" y1="192" x2="184" y2="448" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#FF4B3C" />
			<stop offset="0.55" stop-color="#FF382E" />
			<stop offset="1" stop-color="#DD261E" />
		</linearGradient>
		<linearGradient id="sheen" x1="184" y1="192" x2="184" y2="320" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14" />
