	</g>
	<rect x="96" y="192" width="256" height="256" rx="56" fill="url(#sheen)" />
	<path d="M174.5 265 H273.5 L174.5 375 H273.5" fill="none" stroke="#FFFFFF" stroke-width="24.4" stroke-linecap="butt" stroke-linejoin="miter" />

	<text x="416" y="286" fill="#FFFFFF" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="62" font-weight="600" letter-spacing="-0.5">Cupertino for Zotero</text>
