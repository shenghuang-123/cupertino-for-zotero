<!doctype html>
<meta charset="utf-8">
<style>
	* { box-sizing:border-box; }
	body { margin:0; font:13px/1.6 "Segoe UI",system-ui,sans-serif; background:#F2F2F7; color:#1C1C1E; padding:26px 30px; }
	h1 { font-size:15px; margin:0 0 18px; font-weight:600; }
	.card { width:1060px; background:#fff; border-radius:14px; padding:18px 20px 14px; margin-bottom:20px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
	h2 { font-size:14px; margin:0 0 12px; font-weight:600; }
	.pair { display:flex; }
	.half { width:510px; display:flex; align-items:center; justify-content:center; gap:20px; padding:18px; }
	.light { background:#FFF; border:1px solid #E5E5EA; border-right:0; border-radius:10px 0 0 10px; }
	.dark { background:#1C1C1E; border:1px solid #1C1C1E; border-radius:0 10px 10px 0; }
	.cap { font-size:12px; color:#8E8E93; margin-top:10px; }
</style>

<h1>Cupertino for Zotero · 图标方案对比 — 左：浅色底 / 右：深色底，尺寸 220 · 96 · 48</h1>

<div class="card">
	<h2>方案 A · 圆头笔画</h2>
	<div class="pair">
		<div class="half light"><img src="_master-v1.png" width="220"><img src="_master-v1.png" width="96"><img src="_master-v1.png" width="48"></div>
		<div class="half dark"><img src="_master-v1.png" width="220"><img src="_master-v1.png" width="96"><img src="_master-v1.png" width="48"></div>
	</div>
	<div class="cap">端点圆角，语气更软、更像一颗 App 图标；代价是 48px 下 Z 的转角被圆头吃掉，笔画显粗。</div>
</div>

<div class="card">
	<h2>方案 B · 锐角几何字形（推荐）</h2>
	<div class="pair">
		<div class="half light"><img src="_master-v2.png" width="220"><img src="_master-v2.png" width="96"><img src="_master-v2.png" width="48"></div>
		<div class="half dark"><img src="_master-v2.png" width="220"><img src="_master-v2.png" width="96"><img src="_master-v2.png" width="48"></div>
	</div>
	<div class="cap">真几何 Z，与 Zotero 官方字标同源；渐变跨度与投影都收紧，小尺寸边缘更干净，深色底上红底不发灰。</div>
</div>
